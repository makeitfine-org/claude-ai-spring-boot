server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://app:8080/api/;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Pass the browser-facing host and port so Spring (Tomcat's RemoteIpValve, enabled
        # via server.forward-headers-strategy=native) builds correct absolute redirect URLs.
        # Without X-Forwarded-Port, Tomcat falls back to scheme defaults (port 80 for http)
        # and emits Location headers like `http://localhost/...` that the browser cannot reach.
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  3000;
    }

    location /oauth2/ {
        proxy_pass         http://app:8080/oauth2/;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Pass the browser-facing host and port so Spring (Tomcat's RemoteIpValve, enabled
        # via server.forward-headers-strategy=native) builds correct absolute redirect URLs.
        # Without X-Forwarded-Port, Tomcat falls back to scheme defaults (port 80 for http)
        # and emits Location headers like `http://localhost/...` that the browser cannot reach.
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  3000;
    }

    # SPA route — exact match prevents nginx from issuing an implicit 301 redirect
    # `/login` -> `/login/` (which would then hit the OIDC callback proxy below).
    location = /login {
        try_files /index.html =404;
    }

    location /login/ {
        proxy_pass         http://app:8080/login/;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Pass the browser-facing host and port so Spring (Tomcat's RemoteIpValve, enabled
        # via server.forward-headers-strategy=native) builds correct absolute redirect URLs.
        # Without X-Forwarded-Port, Tomcat falls back to scheme defaults (port 80 for http)
        # and emits Location headers like `http://localhost/...` that the browser cannot reach.
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  3000;
    }
}
