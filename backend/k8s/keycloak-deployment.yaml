apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.2
        args: ["start-dev", "--import-realm"]
        ports:
        - containerPort: 8180
          name: http
        env:
        - name: KC_DB
          value: dev-file
        - name: KC_HTTP_PORT
          value: "8180"
        - name: KC_HOSTNAME
          value: "http://localhost:8180"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HOSTNAME_STRICT_HTTPS
          value: "false"
        - name: KEYCLOAK_ADMIN
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: admin.username
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-secrets
              key: admin.password
        volumeMounts:
        - name: realm-import
          mountPath: /opt/keycloak/data/import
        readinessProbe:
          httpGet:
            path: /realms/claude-ai
            port: 8180
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /realms/claude-ai
            port: 8180
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: realm-import
        configMap:
          name: keycloak-realm
      restartPolicy: Always
